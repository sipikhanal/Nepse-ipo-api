name: IPO Auto-Sync
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run Scraper
        run: python scraper.py
      - name: Commit Change
        run: |
          git config user.name "IPO-Bot"
          git config user.email "bot@github.com"
          git add ipo_data.json
          git commit -m "Sync: ${{ github.event.repository.updated_at }}" || exit 0
          git push
